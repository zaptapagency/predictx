version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: predictx_postgres
    environment:
      POSTGRES_USER: predictx
      POSTGRES_PASSWORD: predictx_dev_password
      POSTGRES_DB: predictx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictx"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: predictx_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: predictx_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://predictx:predictx_dev_password@postgres:5432/predictx
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      SMTP_SERVER: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your-email@gmail.com
      SMTP_PASSWORD: your-app-password
      STRIPE_API_KEY: sk_test_your_test_key
      STRIPE_WEBHOOK_SECRET: whsec_test_secret
      FRONTEND_URL: http://localhost:3000
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: predictx_frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: predictx_network
