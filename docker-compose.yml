version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: universalpredict-postgres
    environment:
      POSTGRES_USER: universalpredict
      POSTGRES_PASSWORD: password
      POSTGRES_DB: universalpredict
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U universalpredict"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - universalpredict

  redis:
    image: redis:7-alpine
    container_name: universalpredict-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - universalpredict

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        LIGHTGBM_REPO_URL: https://github.com/yourusername/your-lightgbm-repo.git
        LIGHTGBM_REPO_BRANCH: main
    container_name: universalpredict-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://universalpredict:password@postgres:5432/universalpredict
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "True"
      LOG_LEVEL: "INFO"
      LIGHTGBM_REPO_PATH: /app/lightgbm-repo
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    networks:
      - universalpredict
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: universalpredict-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
    networks:
      - universalpredict
    command: npm start

volumes:
  postgres_data:

networks:
  universalpredict:
    driver: bridge
